server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config must never be cached, so a redeploy picks up new values.
    location = /env.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Hashed build assets are safe to cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback so client routes deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
